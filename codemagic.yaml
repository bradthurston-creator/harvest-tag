workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    
    environment:
      vars:
        APP_ID: com.harvesttag.app
        APP_NAME: Harvest Tag
      node: latest
      xcode: latest
      cocoapods: default
    
    integrations:
      app_store_connect: Codemagic
    
    scripts:
      - name: Install npm dependencies
        script: |
          cd capacitor
          npm install
      
      - name: Sync Capacitor with iOS
        script: |
          cd capacitor
          npx cap sync ios
      
      - name: Set app bundle identifier
        script: |
          cd capacitor/ios/App
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $APP_ID" App/Info.plist
      
      - name: Build iOS app
        script: |
          cd capacitor/ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath /tmp/xcarchive/App.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=DN52659LL2 \
            archive | xcpretty
      
      - name: Export IPA
        script: |
          mkdir -p /tmp/ipa
          xcodebuild -exportArchive \
            -archivePath /tmp/xcarchive/App.xcarchive \
            -exportPath /tmp/ipa \
            -exportOptionsPlist capacitor/ios/exportOptions.plist \
            -allowProvisioningUpdates \
            | xcpretty
    
    artifacts:
      - /tmp/xcarchive/*.xcarchive
      - /tmp/ipa/*.ipa
    
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - brad.thurston@gmail.com