workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    
    environment:
      vars:
        APP_ID: com.harvesttag.app
        APP_NAME: Harvest Tag
        APP_STORE_CONNECT_EMAIL: brad.thurston@gmail.com
        APP_STORE_CONNECT_PASSWORD: wekc-hwin-isih-syxe
      node: latest
      xcode: latest
      cocoapods: default
    
    scripts:
      - name: Install npm dependencies
        script: |
          cd capacitor
          npm install
      
      - name: Sync Capacitor with iOS
        script: |
          cd capacitor
          npx cap sync ios
      
      - name: Set app bundle identifier
        script: |
          cd capacitor/ios/App
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $APP_ID" App/Info.plist
      
      - name: Build iOS app
        script: |
          cd capacitor/ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath /tmp/xcarchive/App.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=DN52659LL2 \
            archive | xcpretty
    
    artifacts:
      - /tmp/xcarchive/*.xcarchive
    
    publishing:
      email:
        recipients:
          - brad.thurston@gmail.com